<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a0000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bayezid İş Defteri</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#161b26;--mut:#6b7385;--pri:#7a0000;--ok:#12a150;--bad:#d93025;--warn:#e8890c;--bd:#e3e7ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:720px;margin:0 auto;padding:14px 14px 100px}
h1{font-size:22px;margin:6px 0 12px}
h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.big{font-size:20px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;background:#f6e6e6;color:var(--pri);font-weight:600;white-space:nowrap}
.badge.b1{background:#e3f6ea;color:var(--ok)}.badge.b2{background:#fdeaea;color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat .l{font-size:12px;color:var(--mut)}.stat .v{font-size:18px;font-weight:700;margin-top:2px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:#f6e6e6;color:var(--pri)}button.red{background:#fdeaea;color:var(--bad)}button.sm{padding:7px 11px;font-size:14px}
button.ghost{background:transparent;color:var(--mut);padding:8px}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.fab{position:fixed;right:18px;bottom:84px;border-radius:99px;padding:15px 20px;box-shadow:0 6px 18px rgba(122,0,0,.4);z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:10px 4px;font-size:12px;font-weight:600}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:4px}
.tabs button{background:#fff;color:var(--mut);border:1px solid var(--bd);padding:8px 14px;white-space:nowrap;font-size:14px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:#fff;border:1px solid var(--bd);border-radius:99px;padding:5px 11px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#ddd}
.banner{background:#fff4e0;border:1px solid #f5d9a6;color:#8a5200;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#161b26;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:600;font-size:12px}td.r,th.r{text-align:right}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
a{color:var(--pri)}
.brand{position:relative;display:flex;justify-content:center;padding:8px 0 14px}
.brand img{width:100%;max-width:320px;height:auto;display:block}
.gear{position:absolute;right:0;top:0;background:transparent;color:var(--mut);padding:6px 8px;font-size:18px;border-radius:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="fileImport" accept=".json,application/json" style="display:none">
<input type="file" id="filePhoto" accept="image/*" multiple style="display:none">

/* ---------- Veritabanı (IndexedDB) ---------- */
const STORES=['jobs','workers','logs','expenses','payments','photos'];
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('isdefterim',1);
  r.onupgradeneeded=()=>{const d=r.result;
    STORES.forEach(s=>{const st=d.createObjectStore(s,{keyPath:'id'});if(s==='photos')st.createIndex('jobId','jobId')})};
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const all=s=>req(tx(s).getAll());
const put=(s,o)=>req(tx(s,'readwrite').put(o));
const del=(s,id)=>req(tx(s,'readwrite').delete(id));
const clr=s=>req(tx(s,'readwrite').clear());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- Yardımcılar ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(Math.round((n||0)*100)/100)+' ₺';
const num=v=>{const n=parseFloat(String(v??'').replace(/\./g,m=>String(v).includes(',')?'':'.').replace(',','.'));return isNaN(n)?0:n};
const fd=d=>d?d.split('-').reverse().join('.'):'—';
const sum=(a,f)=>a.reduce((t,x)=>t+(f(x)||0),0);
const sign=n=>n>=0?'ok':'bad';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}

const S={jobs:[],workers:[],logs:[],expenses:[],payments:[]};
const V={tab:'jobs',jobId:null,jtab:'ozet',filter:'Hepsi',period:'all',pkind:'Önce'};
async function load(){for(const s of STORES.filter(x=>x!=='photos'))S[s]=await all(s)}

const CATS=['Yemek','Mazot','Malzeme','Ulaşım','Alet / Ekipman','Diğer'];
const TYPES=['Boya','Tadilat','Alçıpan','Seramik / Fayans','Sıva','Elektrik / Tesisat','Diğer'];
const STATS=['Devam ediyor','Bitti','İptal'];

/* ---------- Hesaplamalar ---------- */
function calc(j){
  const logs=S.logs.filter(l=>l.jobId===j.id),ex=S.expenses.filter(e=>e.jobId===j.id),pay=S.payments.filter(p=>p.jobId===j.id);
  const labor=sum(logs,l=>l.hours*l.rate),hours=sum(logs,l=>l.hours),exp=sum(ex,e=>e.amount),paid=sum(pay,p=>p.amount);
  const cost=labor+exp,price=j.price||0,profit=price-cost;
  let days=0;if(j.startDate){const end=j.endDate||today();days=Math.max(1,Math.round((new Date(end)-new Date(j.startDate))/864e5)+1)}
  return{labor,hours,exp,paid,cost,price,profit,left:price-paid,pct:price?profit/price*100:0,days,cash:paid-cost,logs,ex,pay}
}

/* ---------- Modal / Form ---------- */
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#sheet').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function openForm(title,fields,initial,onSave,after){
  const f=fields.map(x=>{
    const v=initial?.[x.k]??x.def??'';let inp;
    if(x.t==='select')inp=`<select name="${x.k}">${x.opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(x.t==='area')inp=`<textarea name="${x.k}" rows="3">${esc(v)}</textarea>`;
    else if(x.t==='date')inp=`<input type="date" name="${x.k}" value="${esc(v)}">`;
    else if(x.t==='num')inp=`<input name="${x.k}" inputmode="decimal" value="${v===''?'':esc(v)}" placeholder="0">`;
    else inp=`<input name="${x.k}" value="${esc(v)}" ${x.list?`list="dl_${x.k}"`:''} ${x.tel?'type="tel"':''} autocomplete="off">${x.list?`<datalist id="dl_${x.k}">${x.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
    return `<label>${esc(x.l)}${x.req?' *':''}</label>${inp}${x.hint?`<div class="mut" style="margin-top:4px">${esc(x.hint)}</div>`:''}`}).join('');
  openModal(`<h1>${esc(title)}</h1><form id="frm">${f}<div class="row" style="margin-top:18px"><button type="button" class="sec" style="flex:1" onclick="closeModal()">Vazgeç</button><button style="flex:2">Kaydet</button></div></form>`);
  const frm=$('#frm');
  frm.onsubmit=async e=>{e.preventDefault();const o={};
    for(const x of fields){let v=frm.elements[x.k].value.trim();if(x.t==='num')v=num(v);
      if(x.req&&(v===''||v===0&&x.t==='num'&&x.nz)){toast(x.l+' boş olamaz');return}o[x.k]=v}
    await onSave(o);closeModal()};
  if(after)after(frm);
}

/* ---------- Ana görünüm ---------- */
function render(){
  let body;
  if(V.jobId)body=jobDetail();
  else body={jobs:jobsView,workers:workersView,report:reportView,backup:backupView}[V.tab]();
  const nav=[['jobs','🛠️','İşler'],['workers','👷','İşçiler'],['report','📊','Rapor']]
    .map(([k,i,l])=>`<button class="${V.tab===k&&!V.jobId?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
  $('#app').innerHTML=(V.jobId?'':`<div class="brand"><img src="${LOGO}" alt="Bayezid"><button class="gear" onclick="go('backup')" aria-label="Yedek">⚙️</button></div>`)+body+`<nav>${nav}</nav>`;
  if(V.jobId&&V.jtab==='foto')loadPhotos();
}
function go(t){V.tab=t;V.jobId=null;render();scrollTo(0,0)}
function openJob(id){V.jobId=id;V.jtab='ozet';render();scrollTo(0,0)}
function setJT(t){V.jtab=t;render()}

/* ---------- İşler listesi ---------- */
function backupBanner(){
  const last=localStorage.getItem('lastBackup');const has=S.jobs.length>0;
  if(!has)return'';
  const d=last?Math.floor((Date.now()-+last)/864e5):null;
  if(d===null)return`<div class="banner">⚠️ Henüz hiç yedek almadın. Telefon kaybolursa veriler gider. <b><a href="#" onclick="go('backup');return false">Yedek al →</a></b></div>`;
  if(d>=7)return`<div class="banner">⚠️ Son yedeğin ${d} gün önce. <b><a href="#" onclick="go('backup');return false">Yedek al →</a></b></div>`;
  return''}
function jobsView(){
  const fl=['Hepsi',...STATS];
  let list=S.jobs.filter(j=>V.filter==='Hepsi'||j.status===V.filter).sort((a,b)=>(b.startDate||b.created||'').localeCompare(a.startDate||a.created||''));
  const cards=list.map(j=>{const c=calc(j);
    return`<div class="card" onclick="openJob('${j.id}')">
      <div class="row sp"><b>${esc(j.name)}</b><span class="badge ${j.status==='Bitti'?'b1':j.status==='İptal'?'b2':''}">${esc(j.status)}</span></div>
      <div class="mut">${esc(j.client)}${j.type?' · '+esc(j.type):''}${j.startDate?' · '+fd(j.startDate):''}</div>
      <div class="row sp" style="margin-top:10px"><div><div class="mut">Anlaşma</div><b>${fmt(c.price)}</b></div>
      <div><div class="mut">Kalan alacak</div><b class="${c.left>0?'warn':'ok'}">${fmt(c.left)}</b></div>
      <div><div class="mut">Kar</div><b class="${sign(c.profit)}">${fmt(c.profit)}</b></div></div></div>`}).join('');
  return`${backupBanner()}<h1>İşlerim</h1>
  <div class="tabs">${fl.map(f=>`<button class="${V.filter===f?'on':''}" onclick="V.filter='${f}';render()">${f}</button>`).join('')}</div>
  ${cards||'<div class="empty">Henüz iş yok.<br>Sağ alttaki <b>+ Yeni İş</b> ile başla.</div>'}
  <button class="fab" onclick="editJob()">+ Yeni İş</button>`}

function editJob(id){
  const j=id?S.jobs.find(x=>x.id===id):null;
  openForm(j?'İşi Düzenle':'Yeni İş',[
    {k:'name',l:'İş adı',req:1,hint:'Örn: Ahmet Bey daire boyası'},
    {k:'client',l:'Müşteri / Firma',req:1,list:[...new Set(S.jobs.map(x=>x.client))]},
    {k:'phone',l:'Telefon',tel:1},
    {k:'address',l:'Adres'},
    {k:'type',l:'İş türü',t:'select',opts:TYPES},
    {k:'price',l:'Anlaşılan tutar (₺)',t:'num'},
    {k:'startDate',l:'Başlangıç tarihi',t:'date',def:today()},
    {k:'endDate',l:'Bitiş tarihi (bitmediyse boş bırak)',t:'date'},
    {k:'status',l:'Durum',t:'select',opts:STATS},
    {k:'notes',l:'Notlar',t:'area'}
  ],j,async v=>{const o={...(j||{}),...v,id:j?.id||uid(),created:j?.created||today()};
    await put('jobs',o);await load();if(!j)V.jobId=o.id,V.jtab='ozet';render();toast('Kaydedildi')});
}
async function delJob(id){
  if(!confirm('Bu iş ve ona bağlı tüm kayıtlar (çalışma, gider, ödeme, fotoğraf) silinsin mi? Geri alınamaz.'))return;
  for(const s of['logs','expenses','payments'])for(const o of S[s].filter(x=>x.jobId===id))await del(s,o.id);
  for(const p of await req(tx('photos').index('jobId').getAll(id)))await del('photos',p.id);
  await del('jobs',id);await load();V.jobId=null;render();toast('Silindi')}
async function finishJob(id){const j=S.jobs.find(x=>x.id===id);j.status='Bitti';if(!j.endDate)j.endDate=today();await put('jobs',j);await load();render();toast('İş bitti olarak işaretlendi')}

async function delItem(s,id){if(!confirm('Silinsin mi?'))return;await del(s,id);await load();render();toast('Silindi')}

/* ---------- Fotoğraf ---------- */
function compress(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=1400;let w=img.width,h=img.height;const s=Math.min(1,m/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej()},'image/jpeg',.72)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}
function pickPhoto(cam){const f=$('#filePhoto');if(cam)f.setAttribute('capture','environment');else f.removeAttribute('capture');f.click()}
$('#filePhoto').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  toast('Kaydediliyor…');let n=0;
  for(const f of files){try{const b=await compress(f);await put('photos',{id:uid(),jobId:V.jobId,kind:V.pkind,date:today(),blob:b});n++}catch(_){}}
  toast(n+' fotoğraf kaydedildi');loadPhotos()});
let PURLS=[];
async function loadPhotos(){
  const g=$('#pgrid');if(!g)return;
  PURLS.forEach(URL.revokeObjectURL);PURLS=[];
  const ph=(await req(tx('photos').index('jobId').getAll(V.jobId))).sort((a,b)=>a.date.localeCompare(b.date));
  if(!ph.length){g.outerHTML='<div id="pgrid" class="empty">Fotoğraf yok.</div>';return}
  g.innerHTML=ph.map(p=>{const u=URL.createObjectURL(p.blob);PURLS.push(u);return`<div style="position:relative"><img src="${u}" onclick="viewPhoto('${p.id}','${u}')"><span class="badge" style="position:absolute;left:5px;top:5px">${esc(p.kind)}</span></div>`}).join('')}
function viewPhoto(id,u){openModal(`<img src="${u}" style="width:100%;border-radius:12px"><div class="row" style="margin-top:12px"><button class="sec" style="flex:1" onclick="closeModal()">Kapat</button><button class="red" onclick="delPhoto('${id}')">Sil</button></div>`)}
async function delPhoto(id){if(!confirm('Fotoğraf silinsin mi?'))return;await del('photos',id);closeModal();loadPhotos()}

/* ---------- İşçiler ---------- */
function workersView(){
  const rows=S.workers.map(w=>{const ls=S.logs.filter(l=>l.worker.toLowerCase()===w.name.toLowerCase());
    const h=sum(ls,l=>l.hours),t=sum(ls,l=>l.hours*l.rate),jobs=new Set(ls.map(l=>l.jobId)).size;

  <button class="fab" onclick="editWorker()">+ İşçi ekle</button>`}
function editWorker(id){
  const w=id?S.workers.find(x=>x.id===id):null;
  openForm(w?'İşçiyi Düzenle':'Yeni İşçi',[{k:'name',l:'Ad Soyad',req:1},{k:'rate',l:'Saatlik ücret (₺)',t:'num'}],w,async v=>{

async function delWorker(id){if(!confirm('İşçi silinsin mi? (Geçmiş çalışma kayıtları durur.)'))return;await del('workers',id);await load();render()}

/* ---------- Rapor ---------- */
function reportView(){
  const t=today();
  const jobs=S.jobs.filter(j=>{if(j.status==='İptal')return false;const d=(j.startDate||j.created||'');
    return V.period==='all'||(V.period==='year'&&d.slice(0,4)===t.slice(0,4))||(V.period==='month'&&d.slice(0,7)===t.slice(0,7))});
  const cs=jobs.map(j=>({j,c:calc(j)}));
  const T={price:sum(cs,x=>x.c.price),paid:sum(cs,x=>x.c.paid),left:sum(cs,x=>x.c.left),labor:sum(cs,x=>x.c.labor),exp:sum(cs,x=>x.c.exp),profit:sum(cs,x=>x.c.profit),hours:sum(cs,x=>x.c.hours),days:sum(cs,x=>x.c.days)};
  const byCat={};cs.forEach(x=>x.c.ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount));
  const clients={};cs.forEach(x=>{const k=x.j.client;clients[k]=clients[k]||{n:0,p:0,pr:0};clients[k].n++;clients[k].p+=x.c.price;clients[k].pr+=x.c.profit});
  return`<h1>Rapor</h1>
  <div class="tabs">${[['all','Tümü'],['year','Bu yıl'],['month','Bu ay']].map(([k,l])=>`<button class="${V.period===k?'on':''}" onclick="V.period='${k}';render()">${l}</button>`).join('')}</div>
  <div class="grid">
    <div class="stat"><div class="l">İş sayısı</div><div class="v">${jobs.length}</div></div>
    <div class="stat"><div class="l">Toplam anlaşma</div><div class="v">${fmt(T.price)}</div></div>
    <div class="stat"><div class="l">Tahsil edilen</div><div class="v ok">${fmt(T.paid)}</div></div>
    <div class="stat"><div class="l">Alacağım</div><div class="v warn">${fmt(T.left)}</div></div>
    <div class="stat"><div class="l">İşçilik</div><div class="v">${fmt(T.labor)}</div></div>
    <div class="stat"><div class="l">Diğer gider</div><div class="v">${fmt(T.exp)}</div></div>
    <div class="stat"><div class="l">NET KAR</div><div class="v ${sign(T.profit)}">${fmt(T.profit)}</div></div>
    <div class="stat"><div class="l">Çalışma saati</div><div class="v">${T.hours}</div></div>
  </div>
  <h2>Gider türleri</h2><div class="card">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row sp" style="padding:4px 0"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join('')||'<span class="mut">Gider yok</span>'}</div>
  <h2>İşlere göre kar</h2><div class="card" style="overflow-x:auto"><table><tr><th>İş</th><th class="r">Gün</th><th class="r">Anlaşma</th><th class="r">Kar</th></tr>
    ${cs.sort((a,b)=>b.c.profit-a.c.profit).map(x=>`<tr onclick="openJob('${x.j.id}')"><td>${esc(x.j.name)}<div class="mut">${esc(x.j.client)}</div></td><td class="r">${x.c.days||'—'}</td><td class="r">${fmt(x.c.price)}</td><td class="r ${sign(x.c.profit)}"><b>${fmt(x.c.profit)}</b></td></tr>`).join('')||'<tr><td colspan="4" class="mut">İş yok</td></tr>'}</table></div>
  <h2>Müşteri / Firmaya göre</h2><div class="card" style="overflow-x:auto"><table><tr><th>Müşteri</th><th class="r">İş</th><th class="r">Kar</th></tr>
    ${Object.entries(clients).sort((a,b)=>b[1].pr-a[1].pr).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.n}</td><td class="r ${sign(v.pr)}"><b>${fmt(v.pr)}</b></td></tr>`).join('')||'<tr><td colspan="3" class="mut">—</td></tr>'}</table></div>
  <button class="sec" onclick="exportCSV()">📄 İş listesini Excel (CSV) olarak indir</button>`}
function exportCSV(){
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const rows=[['İş','Müşteri','Tür','Durum','Başlangıç','Bitiş','Gün','Anlaşma','Tahsil','Kalan','İşçilik','Diğer gider','Kar','Saat']];
  S.jobs.forEach(j=>{const c=calc(j);rows.push([j.name,j.client,j.type,j.status,j.startDate,j.endDate,c.days,c.price,c.paid,c.left,c.labor,c.exp,c.profit,c.hours])});
  const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n')],{type:'text/csv'});download(b,'isler-'+today()+'.csv')}

/* ---------- Yedek ---------- */
function download(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function makeBackup(){
  const o={app:'isdefterim',v:1,date:new Date().toISOString()};
  for(const s of STORES.filter(x=>x!=='photos'))o[s]=await all(s);
  o.photos=await Promise.all((await all('photos')).map(async p=>({...p,blob:await b2d(p.blob)})));
  return new Blob([JSON.stringify(o)],{type:'application/json'})}
const bname=()=>'is-defterim-yedek-'+today()+'.json';
async function doBackup(share){
  toast('Hazırlanıyor…');const b=await makeBackup();
  if(share){const f=new File([b],bname(),{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'İş Defterim yedek'});localStorage.setItem('lastBackup',Date.now());render();return}catch(e){if(e.name==='AbortError')return}}
    toast('Paylaşma desteklenmiyor, indiriliyor');}
  download(b,bname());localStorage.setItem('lastBackup',Date.now());render();toast('Yedek indirildi')}
$('#fileImport').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());if(o.app!=='isdefterim')throw 0;
    if(!confirm(`Yedekteki veriler yüklenecek. Şu an telefondaki TÜM veriler silinip yedektekiyle değişecek.\nYedek tarihi: ${o.date.slice(0,10)} · ${o.jobs.length} iş\nDevam edilsin mi?`))return;
    toast('Yükleniyor…');
    for(const s of STORES)await clr(s);
    for(const s of STORES.filter(x=>x!=='photos'))for(const r of o[s]||[])await put(s,r);
    for(const p of o.photos||[])await put('photos',{...p,blob:await (await fetch(p.blob)).blob()});
    await load();V.jobId=null;V.tab='jobs';render();toast('Yedek yüklendi')
  }catch(_){toast('Bu dosya geçerli bir yedek değil')}});
function backupView(){
  const last=localStorage.getItem('lastBackup');
  return`<h1>Yedekleme</h1>
  <div class="card"><div class="mut">Son yedek</div><div class="big">${last?new Date(+last).toLocaleDateString('tr-TR'):'Hiç alınmadı'}</div></div>
  <div class="card"><b>Verilerin telefonunda saklanır.</b><div class="mut" style="margin-top:4px">Telefon kaybolur, sıfırlanır ya da tarayıcı verisi silinirse veriler gider. Haftada bir yedek al ve dosyayı <b>Google Drive, WhatsApp (kendine) ya da e-postana</b> gönder.</div></div>
  <button style="width:100%;margin-bottom:10px" onclick="doBackup(true)">📤 Yedeği al ve paylaş (Drive / WhatsApp / Mail)</button>
  <button class="sec" style="width:100%;margin-bottom:10px" onclick="doBackup(false)">⬇️ Yedeği telefona indir</button>
  <button class="sec" style="width:100%" onclick="$('#fileImport').click()">📥 Yedekten geri yükle</button>
  <div class="mut" style="margin-top:14px">${S.jobs.length} iş · ${S.workers.length} işçi · ${S.logs.length} çalışma kaydı · ${S.expenses.length} gider · ${S.payments.length} ödeme</div>`}

/* ---------- Başlat ---------- */
(async()=>{
  await openDB();await load();render();
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(_){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
